name: Release

# Builds Windows and macOS installers in the cloud and attaches them to a
# draft GitHub Release. Trigger by pushing a tag like `v0.1.0`, or manually
# via the Actions tab (workflow_dispatch) for a test build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Stash v__VERSION__"
          releaseBody: "Windows and macOS installers for this release — see the assets below. macOS build is currently unsigned: right-click the app and choose Open the first time to bypass Gatekeeper."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
