[package]
name = "stash-setup"
version = "0.1.3"
description = "Installer for Stash"
authors = ["Stash Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stash_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0"
tar = "0.4"
zstd = "0.13"

[dependencies]
tauri = { version = "2.11.6", features = [] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tar = "0.4"
zstd = "0.13"
sysinfo = "0.36.1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# The payload already dominates the binary; keep the setup code itself small.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
