<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>
    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <filter id="fold-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-0.5" dy="0.8" stdDeviation="0.6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg-grad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="white" stroke-opacity="0.12" stroke-width="1" />

  <!-- Document body with top-right corner cut -->
  <path
    d="M 10 6.5
       C 8.6 6.5 7.5 7.6 7.5 9
       L 7.5 23
       C 7.5 24.4 8.6 25.5 10 25.5
       L 22 25.5
       C 23.4 25.5 24.5 24.4 24.5 23
       L 24.5 11.5
       L 19.5 6.5
       Z"
    fill="#FAFAFA"
  />

  <!-- Dog-ear fold shadow -->
  <path
    d="M 19.5 6.5
       L 19.5 10
       C 19.5 11 20 11.5 21 11.5
       L 24.5 11.5
       Z"
    fill="#000000"
    opacity="0.12"
  />

  <!-- Dog-ear fold corner -->
  <path
    d="M 19.5 6.5
       C 20 7.5 20.2 8.5 20 9.5
       C 19.8 10.5 20.5 11.5 21.5 11.5
       L 24.5 11.5
       C 23.5 10.8 22 9.5 19.5 6.5
       Z"
    fill="url(#fold-grad)"
  />

  <!-- Document content lines -->
  <rect x="10" y="10.5" width="6.5" height="1.8" rx="0.9" fill="#71717A" />
  <rect x="10" y="14.2" width="12" height="1.8" rx="0.9" fill="#71717A" />
  <rect x="10" y="17.9" width="12" height="1.8" rx="0.9" fill="#71717A" />
  <rect x="10" y="21.6" width="8.5" height="1.8" rx="0.9" fill="#71717A" />
</svg>
